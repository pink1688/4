<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>即時帳務查詢 APP</title><style>body{font:16px/1.6 system-ui;margin:0;background:#f3f6f2;color:#173c39}header{background:#173c39;color:white;padding:20px}main{max-width:850px;margin:auto;padding:18px}.panel{background:white;border-radius:14px;padding:18px;margin:14px 0}input,textarea,button{font:inherit;padding:10px;border:1px solid #b5c7b9;border-radius:8px}input,textarea{width:100%;box-sizing:border-box}button{background:#173c39;color:white;margin:4px}article{border-top:1px solid #ddd;padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#65766c}.muted{color:#64746a}nav.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}nav.tabs button{background:white;color:#173c39;border:1px solid #b5c7b9}nav.tabs button.active{background:#173c39;color:white}.notice{background:#fff4d7;padding:12px;border-radius:12px}details{margin:10px 0}summary{cursor:pointer;font-weight:600}article{background:#fff;border:1px solid #d9e4da;border-radius:12px;margin:12px 0;padding:16px}article .body{white-space:pre-wrap}article button{background:white;color:#173c39}#count{font-size:14px}</style></head><body><header><h2>即時帳務查詢 APP</h2><div>穩定手機版｜帳務筆記與借貸分錄</div></header><main><section class="panel"><b>本機資料匯入與備份</b><p>公開網站不內建工作筆記。請在自己的手機匯入原始 HTML，資料只在此裝置瀏覽器處理，不會上傳 GitHub。</p><input id="file" type="file" accept=".html,.json"><p id="status" role="status">尚未匯入資料</p></section><nav class="tabs"><button id="tabqa">白話問答</button><button id="tabnotes">帳務查詢</button><button id="tabentries">會計事項／借貸分錄</button></nav><section class="panel"><h2 id="sectiontitle">白話問答</h2><p id="hint">輸入問題，從原始筆記尋找相關答案與分錄。</p><label for="q">查詢帳務、會計事項或分錄</label><input id="q" placeholder="例如：預付款、保留款、280066"><button id="search">查詢</button><button id="all">顯示全部</button><button id="clear">清除本機資料</button><p id="count"></p><div id="results"></div></section><section class="panel"><h3>新增個人筆記</h3><input id="title" placeholder="主題"><textarea id="body" rows="4" placeholder="內容／借貸分錄"></textarea><button id="add">新增</button><button id="export">匯出備份 JSON</button></section></main><script>
(function(){
"use strict";
const $=id=>document.getElementById(id);let notes=[];let tab="qa";
try{notes=JSON.parse(localStorage.getItem("voucher_local_notes")||"[]")}catch(e){notes=[]}
function save(){try{localStorage.setItem("voucher_local_notes",JSON.stringify(notes))}catch(e){$("status").textContent="本機空間不足，請匯出備份"}}
function render(term=""){const out=$("results");out.replaceChildren();const q=term.toLowerCase();let found=notes.filter(n=>(n.title+" "+n.body).toLowerCase().includes(q));if(tab==="entries")found=found.filter(n=>/分錄|借方|貸方|會計事項|科目|傳票/.test(n.title+" "+n.body));$("status").textContent="本機資料："+notes.length+" 筆";$("count").textContent="共有 "+found.length+" 筆相關資料"+(found.length>50?"，先顯示前50筆":"");if(!found.length){const p=document.createElement("p");p.textContent=notes.length?"找不到相關資料，請更換關鍵字。":"尚未匯入筆記，請先選擇原始 HTML 或 JSON 檔案。";out.append(p)}for(const n of found.slice(0,50)){const a=document.createElement("article"),tag=document.createElement("small"),h=document.createElement("strong"),details=document.createElement("details"),sum=document.createElement("summary"),p=document.createElement("div"),del=document.createElement("button"),edit=document.createElement("button");tag.textContent=/分錄|借方|貸方/.test(n.body)?"會計事項｜借貸分錄":"筆記｜主計通知公告";h.textContent=n.title;sum.textContent="查看完整內容";p.className="body";p.textContent=n.body;details.append(sum,p);del.textContent="刪除";edit.textContent="修改";del.onclick=()=>{if(confirm("確定刪除？")){notes=notes.filter(x=>x.id!==n.id);save();render($("q").value)}};edit.onclick=()=>{const t=prompt("修改主題",n.title);if(t===null)return;const b=prompt("修改內容",n.body);if(b===null)return;n.title=t;n.body=b;save();render($("q").value)};a.append(tag,document.createElement("br"),h,details,edit,del);out.append(a)}}
function switchTab(t){tab=t;for(const x of ["qa","notes","entries"])$("tab"+x).classList.toggle("active",t===x);$("sectiontitle").textContent=t==="qa"?"白話問答":t==="notes"?"帳務查詢":"會計事項／借貸分錄";$("hint").textContent=t==="qa"?"輸入問題，從原始筆記尋找相關答案與分錄。離線關鍵字查詢，不會假裝產生 AI 答案。":t==="notes"?"搜尋工作筆記、公告及帳務處理內容。":"搜尋會計事項、借方、貸方、科目與分錄。";render($("q").value)}
for(const x of ["qa","notes","entries"])$("tab"+x).onclick=()=>switchTab(x);
function extract(raw){let obj;const mark="const VoucherData=";let pos=raw.indexOf(mark);if(pos>=0){let start=raw.indexOf("{",pos+mark.length),depth=0,str=false,esc=false,end=-1;for(let i=start;i<raw.length;i++){let c=raw[i];if(str){if(esc)esc=false;else if(c==="\\")esc=true;else if(c==='"')str=false}else if(c==='"')str=true;else if(c==="{")depth++;else if(c==="}"&&!--depth){end=i+1;break}}if(end<0)throw Error("資料格式不完整");obj=JSON.parse(raw.slice(start,end))}else obj=JSON.parse(raw);let arr=[];if(Array.isArray(obj))arr=obj;else if(Array.isArray(obj.notes)){for(const sheet of obj.notes)for(const row of sheet.rows||[]){const cells=(row.cells||[]).map(x=>x.text).filter(Boolean);if(cells.length)arr.push({title:sheet.name+" 第"+row.row+"列 "+cells[0].slice(0,60),body:cells.join("\n")})}for(const [key,value] of Object.entries(obj)){if(key==="notes"||!Array.isArray(value))continue;for(const entry of value){if(entry&&typeof entry==="object")arr.push({title:key+" "+(entry.title||entry.name||entry.code||""),body:JSON.stringify(entry,null,2)})}}}else throw Error("找不到可匯入資料");return arr.map((n,i)=>({id:"import-"+Date.now()+"-"+i,title:String(n.title||n.name||"會計資料"),body:String(n.body||n.content||JSON.stringify(n))}))}
$("file").onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const incoming=extract(await f.text());if(!incoming.length)throw Error("檔案沒有可匯入的資料");notes=notes.concat(incoming);save();render();$("status").textContent="匯入成功："+incoming.length+" 筆"}catch(err){$("status").textContent="匯入失敗："+err.message}};
$("search").onclick=()=>render($("q").value);$("all").onclick=()=>{$("q").value="";render()};$("q").oninput=()=>render($("q").value);
$("add").onclick=()=>{if(!$("title").value.trim())return alert("請輸入主題");notes.unshift({id:"new-"+Date.now(),title:$("title").value,body:$("body").value});save();$("title").value="";$("body").value="";render()};
$("clear").onclick=()=>{if(confirm("確定清除本機所有筆記？請先匯出備份。")){notes=[];save();render()}};
$("export").onclick=()=>{const b=new Blob([JSON.stringify(notes,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="帳務筆記備份.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
switchTab("qa");
})()
</script></body></html>
