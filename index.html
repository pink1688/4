<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>即時帳務查詢 APP</title><style>body{font:16px/1.6 system-ui;margin:0;background:#f3f6f2;color:#173c39}header{background:#173c39;color:white;padding:20px}main{max-width:850px;margin:auto;padding:18px}.panel{background:white;border-radius:14px;padding:18px;margin:14px 0}input,textarea,button{font:inherit;padding:10px;border:1px solid #b5c7b9;border-radius:8px}input,textarea{width:100%;box-sizing:border-box}button{background:#173c39;color:white;margin:4px}article{border-top:1px solid #ddd;padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#65766c}.muted{color:#64746a}</style></head><body><header><h2>即時帳務查詢 APP</h2><div>手機版・帳務筆記・借貸分錄</div></header><main><section class="panel"><b>私人資料保護</b><p>公開網站不內建工作筆記。請在自己的手機匯入原始 HTML，資料只在此裝置瀏覽器處理，不會上傳 GitHub。</p><input id="file" type="file" accept=".html,.json"><p id="status" role="status">尚未匯入資料</p></section><section class="panel"><label for="q">查詢帳務、會計事項或分錄</label><input id="q" placeholder="例如：預付款、保留款、280066"><button id="search">搜尋</button><button id="all">顯示全部</button><button id="clear">清除本機資料</button><div id="results"></div></section><section class="panel"><h3>新增個人筆記</h3><input id="title" placeholder="主題"><textarea id="body" rows="4" placeholder="內容／借貸分錄"></textarea><button id="add">新增</button><button id="export">匯出備份 JSON</button></section></main><script>
(function(){
"use strict";
const $=id=>document.getElementById(id);let notes=[];
try{notes=JSON.parse(localStorage.getItem("voucher_local_notes")||"[]")}catch(e){notes=[]}
function save(){try{localStorage.setItem("voucher_local_notes",JSON.stringify(notes))}catch(e){$("status").textContent="本機空間不足，請匯出備份"}}
function render(term=""){const out=$("results");out.replaceChildren();let found=notes.filter(n=>(n.title+" "+n.body).toLowerCase().includes(term.toLowerCase()));$("status").textContent="本機共 "+notes.length+" 筆，符合 "+found.length+" 筆";for(const n of found.slice(0,100)){const a=document.createElement("article"),h=document.createElement("b"),p=document.createElement("div"),del=document.createElement("button"),edit=document.createElement("button");h.textContent=n.title;p.textContent=n.body;del.textContent="刪除";edit.textContent="修改";del.onclick=()=>{if(confirm("確定刪除？")){notes=notes.filter(x=>x.id!==n.id);save();render($("q").value)}};edit.onclick=()=>{const t=prompt("修改主題",n.title);if(t===null)return;const b=prompt("修改內容",n.body);if(b===null)return;n.title=t;n.body=b;save();render($("q").value)};a.append(h,p,edit,del);out.append(a)}if(found.length>100){const x=document.createElement("p");x.textContent="僅顯示前100筆，請輸入更精確的關鍵字。";out.append(x)}}
function extract(raw){let obj;const mark="const VoucherData=";let pos=raw.indexOf(mark);if(pos>=0){let start=raw.indexOf("{",pos+mark.length),depth=0,str=false,esc=false,end=-1;for(let i=start;i<raw.length;i++){let c=raw[i];if(str){if(esc)esc=false;else if(c==="\\")esc=true;else if(c==='"')str=false}else if(c==='"')str=true;else if(c==="{")depth++;else if(c==="}"&&!--depth){end=i+1;break}}if(end<0)throw Error("資料格式不完整");obj=JSON.parse(raw.slice(start,end))}else obj=JSON.parse(raw);let arr=[];if(Array.isArray(obj))arr=obj;else if(Array.isArray(obj.notes)){for(const sheet of obj.notes)for(const row of sheet.rows||[]){const cells=(row.cells||[]).map(x=>x.text).filter(Boolean);if(cells.length)arr.push({title:sheet.name+" 第"+row.row+"列 "+cells[0].slice(0,60),body:cells.join("\n")})}for(const [key,value] of Object.entries(obj)){if(key==="notes"||!Array.isArray(value))continue;for(const entry of value){if(entry&&typeof entry==="object")arr.push({title:key+" "+(entry.title||entry.name||entry.code||""),body:JSON.stringify(entry,null,2)})}}}else throw Error("找不到可匯入資料");return arr.map((n,i)=>({id:"import-"+Date.now()+"-"+i,title:String(n.title||n.name||"會計資料"),body:String(n.body||n.content||JSON.stringify(n))}))}
$("file").onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const incoming=extract(await f.text());if(!incoming.length)throw Error("檔案沒有可匯入的資料");notes=notes.concat(incoming);save();render();$("status").textContent="匯入成功："+incoming.length+" 筆"}catch(err){$("status").textContent="匯入失敗："+err.message}};
$("search").onclick=()=>render($("q").value);$("all").onclick=()=>{$("q").value="";render()};$("q").oninput=()=>render($("q").value);
$("add").onclick=()=>{if(!$("title").value.trim())return alert("請輸入主題");notes.unshift({id:"new-"+Date.now(),title:$("title").value,body:$("body").value});save();$("title").value="";$("body").value="";render()};
$("clear").onclick=()=>{if(confirm("確定清除本機所有筆記？請先匯出備份。")){notes=[];save();render()}};
$("export").onclick=()=>{const b=new Blob([JSON.stringify(notes,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="帳務筆記備份.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
render();
})()
</script></body></html>
